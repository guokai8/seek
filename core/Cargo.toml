[package]
name = "seek-core"
version = "0.1.0"
edition = "2021"
description = "Lightweight macOS file search engine: fd-style traversal + fzf-style fuzzy matching"
license = "MIT"

[lib]
name = "seek_core"
crate-type = ["staticlib", "rlib"]

[dependencies]
# fd-style traversal
ignore = "0.4.34"
globset = "0.4.21"
regex = "1.13.1"
memchr = "2.8.3"

# concurrency
crossbeam-channel = "0.5.17"
rayon = "1.12.0"

# persistence
postcard = { version = "1.1.3", features = ["use-std"] }
zstd = "0.14.3"
serde = { version = "1.0.229", features = ["derive"] }

[target.'cfg(target_os = "macos")'.dependencies]
# The CoreFoundation frameworks are linked directly by the watcher, so no
# additional crates are needed here.

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
